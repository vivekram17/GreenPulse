spring.application.name=greenpulse-ai

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/greenpulse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- LLM (OpenAI or Gemini) ---
# provider: openai | gemini
llm.provider=gemini
# Leave blank (or the LLM_API_KEY env var unset) to run entirely on the built-in
# rule-based fallback, with zero external API calls.
llm.api-key=api_key
# Optional model override, e.g. gemini-3.6-flash or gemini-1.5-flash. Leave blank for the default.
llm.model=granite-4-0-h-small

server.port=8080
 
