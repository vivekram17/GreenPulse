spring.application.name=greenpulse-ai

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/greenpulse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- LLM (Ollama / IBM Granite) ---
# Enable AI processing
llm.enabled=true
# LLM provider
llm.provider=ibm
# Ollama local API
llm.api-url=http://localhost:11434/api/chat
# IBM Granite model running through Ollama
llm.model=ibm/granite4.2:3b

server.port=8080